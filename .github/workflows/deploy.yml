name: deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Deploy only from main, and only on a real push — never from a PR,
      # since a fork PR would otherwise get access to the deploy credential.
      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Schema changes must reach D1 before the new code that depends on them.
      # Migrations are idempotent: already-applied ones are skipped.
      - name: Apply D1 migrations
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npx wrangler d1 migrations apply cuantofalta --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
